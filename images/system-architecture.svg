<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arP" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#B45309"/>
    </marker>
    <marker id="arS" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arSb" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="62" font-size="30" font-weight="bold" fill="#0F172A">CanBot — System Architecture</text>
  <text x="60" y="92" font-size="17" fill="#64748B">Autonomous waste-sorting rover · perception on Raspberry Pi, actuation on Arduino</text>
  <line x1="60" y1="112" x2="1540" y2="112" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Stage labels -->
  <text x="60"   y="152" font-size="13" font-weight="bold" fill="#2563EB" letter-spacing="2">SENSING</text>
  <text x="350"  y="152" font-size="13" font-weight="bold" fill="#7C3AED" letter-spacing="2">PERCEPTION &amp; PLANNING</text>
  <text x="790"  y="152" font-size="13" font-weight="bold" fill="#059669" letter-spacing="2">LOW-LEVEL CONTROL</text>
  <text x="1130" y="152" font-size="13" font-weight="bold" fill="#EA580C" letter-spacing="2">ACTUATION</text>

  <!-- ============ Col 1: Webcams ============ -->
  <rect x="60" y="170" width="220" height="215" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="170" y="212" font-size="19" font-weight="bold" fill="#1E3A8A" text-anchor="middle">Webcams</text>
  <line x1="90" y1="228" x2="250" y2="228" stroke="#BFDBFE" stroke-width="2"/>
  <text x="170" y="258" font-size="15" fill="#1E40AF" text-anchor="middle">2 × Logitech</text>
  <text x="170" y="280" font-size="15" fill="#1E40AF" text-anchor="middle">C270 HD</text>
  <text x="170" y="318" font-size="13.5" fill="#64748B" text-anchor="middle">Continuous video</text>
  <text x="170" y="338" font-size="13.5" fill="#64748B" text-anchor="middle">capture of the</text>
  <text x="170" y="358" font-size="13.5" fill="#64748B" text-anchor="middle">rover's path</text>

  <!-- arrow 1 -->
  <line x1="284" y1="277" x2="342" y2="277" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="313" y="266" font-size="12.5" fill="#475569" text-anchor="middle">USB</text>

  <!-- ============ Col 2: Raspberry Pi ============ -->
  <rect x="350" y="170" width="340" height="215" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="520" y="212" font-size="19" font-weight="bold" fill="#5B21B6" text-anchor="middle">Raspberry Pi 3</text>
  <line x1="380" y1="228" x2="660" y2="228" stroke="#DDD6FE" stroke-width="2"/>
  <text x="380" y="258" font-size="14.5" fill="#4C1D95">1 ·  OpenCV preprocessing</text>
  <text x="380" y="285" font-size="14.5" fill="#4C1D95">2 ·  YOLO v3 detection</text>
  <text x="380" y="312" font-size="14.5" fill="#4C1D95">3 ·  Classify: bottle / can</text>
  <text x="380" y="339" font-size="14.5" fill="#4C1D95">4 ·  Inverse kinematics solver</text>
  <text x="380" y="366" font-size="14.5" fill="#4C1D95">5 ·  Emit joint angles</text>

  <!-- NCS2 link -->
  <line x1="520" y1="389" x2="520" y2="437" stroke="#7C3AED" stroke-width="2.5"
        marker-end="url(#arS)" marker-start="url(#arSb)"/>
  <text x="537" y="418" font-size="12.5" fill="#7C3AED">USB 3.0</text>

  <rect x="350" y="440" width="340" height="88" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="520" y="472" font-size="17" font-weight="bold" fill="#5B21B6" text-anchor="middle">Intel NCS2</text>
  <text x="520" y="497" font-size="13.5" fill="#64748B" text-anchor="middle">Movidius Myriad X VPU</text>
  <text x="520" y="517" font-size="13.5" fill="#64748B" text-anchor="middle">Inference offload · 30 fps</text>

  <!-- arrow 2 -->
  <line x1="694" y1="277" x2="782" y2="277" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="738" y="264" font-size="12.5" font-weight="bold" fill="#334155" text-anchor="middle">Serial / UART</text>
  <text x="738" y="300" font-size="12" fill="#64748B" text-anchor="middle">target coords</text>
  <text x="738" y="318" font-size="12" fill="#64748B" text-anchor="middle">&lt; 50 ms</text>

  <!-- ============ Col 3: Arduino ============ -->
  <rect x="790" y="170" width="260" height="215" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="920" y="212" font-size="19" font-weight="bold" fill="#065F46" text-anchor="middle">Arduino Uno</text>
  <line x1="820" y1="228" x2="1020" y2="228" stroke="#A7F3D0" stroke-width="2"/>
  <text x="920" y="260" font-size="14.5" fill="#047857" text-anchor="middle">Decode string</text>
  <text x="920" y="284" font-size="14.5" fill="#047857" text-anchor="middle">→ int array</text>
  <text x="920" y="320" font-size="14.5" fill="#047857" text-anchor="middle">PWM drive,</text>
  <text x="920" y="344" font-size="14.5" fill="#047857" text-anchor="middle">8 channels</text>

  <!-- arrows 3: fan out -->
  <path d="M1054,250 L1092,250 L1092,225 L1122,225" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M1054,305 L1092,305 L1092,382 L1122,382" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1092" y="410" font-size="12.5" fill="#475569" text-anchor="middle">PWM × 8</text>

  <!-- ============ Col 4: Actuators ============ -->
  <rect x="1130" y="170" width="410" height="112" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
  <text x="1160" y="205" font-size="18" font-weight="bold" fill="#9A3412">Robotic arm — 6 DOF</text>
  <text x="1160" y="234" font-size="14" fill="#C2410C">4 × standard servo  ·  base, elbows, wrist</text>
  <text x="1160" y="258" font-size="14" fill="#C2410C">2 × SG90 micro  ·  wrist rotation, gripper</text>

  <rect x="1130" y="326" width="410" height="112" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
  <text x="1160" y="361" font-size="18" font-weight="bold" fill="#9A3412">Rover drive</text>
  <text x="1160" y="390" font-size="14" fill="#C2410C">2 × MG996R continuous rotation</text>
  <text x="1160" y="414" font-size="14" fill="#C2410C">2 × castor wheels (rear)</text>

  <!-- ============ Power band ============ -->
  <line x1="60" y1="600" x2="1540" y2="600" stroke="#E2E8F0" stroke-width="2"/>
  <text x="60" y="638" font-size="13" font-weight="bold" fill="#B45309" letter-spacing="2">POWER</text>
  <text x="60" y="662" font-size="12.5" fill="#94A3B8">Logic rail — mains tethered</text>
  <text x="790" y="662" font-size="12.5" fill="#94A3B8">Motor rail — battery</text>
  <line x1="738" y1="646" x2="738" y2="790" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 5"/>

  <rect x="60" y="674" width="230" height="92" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
  <text x="175" y="708" font-size="16" font-weight="bold" fill="#78350F" text-anchor="middle">AC–DC wall PSU</text>
  <text x="175" y="734" font-size="13.5" fill="#92400E" text-anchor="middle">5 V, tethered</text>

  <line x1="294" y1="720" x2="352" y2="720" stroke="#B45309" stroke-width="2.5" marker-end="url(#arP)"/>

  <rect x="356" y="674" width="330" height="92" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
  <text x="521" y="708" font-size="16" font-weight="bold" fill="#78350F" text-anchor="middle">Raspberry Pi · Arduino · Webcams</text>
  <text x="521" y="734" font-size="13.5" fill="#92400E" text-anchor="middle">Arduino and NCS2 powered from Pi USB</text>

  <rect x="790" y="674" width="240" height="92" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
  <text x="910" y="708" font-size="16" font-weight="bold" fill="#78350F" text-anchor="middle">4 × 18650 cells</text>
  <text x="910" y="734" font-size="13.5" fill="#92400E" text-anchor="middle">series + parallel</text>

  <line x1="1034" y1="720" x2="1092" y2="720" stroke="#B45309" stroke-width="2.5" marker-end="url(#arP)"/>

  <rect x="1096" y="674" width="200" height="92" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
  <text x="1196" y="701" font-size="16" font-weight="bold" fill="#78350F" text-anchor="middle">12 → 5 V buck</text>
  <text x="1196" y="725" font-size="13.5" fill="#92400E" text-anchor="middle">current divider</text>
  <text x="1196" y="747" font-size="13.5" fill="#92400E" text-anchor="middle">4 A fuse</text>

  <line x1="1300" y1="720" x2="1358" y2="720" stroke="#B45309" stroke-width="2.5" marker-end="url(#arP)"/>

  <rect x="1362" y="674" width="178" height="92" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
  <text x="1451" y="708" font-size="16" font-weight="bold" fill="#78350F" text-anchor="middle">Drive servos</text>
  <text x="1451" y="734" font-size="13.5" fill="#92400E" text-anchor="middle">2.5 A stall each</text>

  <!-- Footer -->
  <line x1="60" y1="812" x2="1540" y2="812" stroke="#E2E8F0" stroke-width="2"/>
  <text x="60" y="848" font-size="13.5" fill="#64748B">Detection 92% precision / 88% recall  ·  classification 90%  ·  pick-and-place 85%  ·  IK positional error &lt; 5 mm in 90% of trials</text>
  <text x="60" y="872" font-size="13.5" fill="#94A3B8">EE297 Intelligent Systems Project · Maynooth University · 2024</text>
</svg>
